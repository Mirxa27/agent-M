<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Glowing Effect (Background) -->
  <defs>
    <radialGradient id="backgroundGlow" cx="400" cy="400" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001a33" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </radialGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0af" />
      <stop offset="100%" stop-color="#06f" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="100%" stop-color="#eee" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="800" height="800" fill="url(#backgroundGlow)" />
  
  <!-- Main M Logo -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <!-- Left Vertical Line -->
    <path d="M0,0 L0,280 L60,250 L60,30 Z" fill="url(#logoGradient)" />
    
    <!-- Right Vertical Line -->
    <path d="M400,0 L400,280 L340,250 L340,30 Z" fill="url(#logoGradient)" />
    
    <!-- First Diagonal -->
    <path d="M60,30 L200,170 L200,220 L60,80 Z" fill="url(#logoGradient)" />
    
    <!-- Second Diagonal -->
    <path d="M340,30 L200,170 L200,220 L340,80 Z" fill="url(#logoGradient)" />
    
    <!-- Star/Sparkle -->
    <path d="M325,40 L340,10 L355,40 L385,55 L355,70 L340,100 L325,70 L295,55 Z" fill="url(#logoGradient)" />
  </g>
  
  <!-- MIRXA Text -->
  <g transform="translate(230, 580)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#textGradient)" stroke="#fff" stroke-width="1">MIRXA</text>
  </g>
</svg>